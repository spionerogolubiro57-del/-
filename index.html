<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход на сайт</title>
  <!-- Подключаем официальный скрипт авторизации Google -->
  <script src="https://google.com" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f3f4f6;
    }
    .auth-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }
    h2 {
      margin: 0 0 24px;
      text-align: center;
      color: #111827;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #6b7280;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e5e7eb;
    }
    .divider:not(:empty)::before { margin-right: 10px; }
    .divider:not(:empty)::after { margin-left: 10px; }
    
    .google-btn-wrapper {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Вход в аккаунт</h2>

    <!-- Обычная форма входа -->
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Войти</button>
    </form>

    <div class="divider">или</div>

    <!-- Настройки и кнопка входа через Google -->
    <div id="g_id_onload"
         data-client_id="1013027545882-s8m299la8rja6m8h75f9b78v3mikuiut.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    
    <div class="google-btn-wrapper">
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>
  </div>

  <script>
    // Функция сработает после успешного входа через Google
    function handleCredentialResponse(response) {
      // Google вернет JWT-токен с данными пользователя (имя, почта, аватар)
      console.log("Успешный вход! Токен:", response.credential);
      alert("Вы успешно вошли через Google! Токен выведен в консоль (F12).");
    }
  </script>

</body>
</html>
